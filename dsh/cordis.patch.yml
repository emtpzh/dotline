# dsh-dotline extends the Web profile: it reuses the existing DSH server
# and mounts the Dotline SPA under /dotline/ on the same origin.
- insert:
    - id: dotline
      name: dsh-dotline
      config:
        # Path prefix this plugin serves the SPA under.
        mountPrefix: /dotline
        # Extra authorities the /dotline/api Host check accepts; localhost
        # and 127.0.0.1 are always allowed.
        trustedHosts: []
