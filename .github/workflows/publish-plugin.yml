# Publish the DeepSeek Harness plugin (dsh-dotline) to npm on every
# release tag, through npm Trusted Publishing: the job proves it is this
# repository's workflow via GitHub's OIDC token and npm mints a short-lived
# publish credential for it. No npm token, no one-time password, and every
# published version carries provenance pointing back at the commit.
#
# One-time setup on npmjs.com (package dsh-dotline → Settings → Trusted
# Publisher → GitHub Actions): owner emtpzh, repository dotline,
# workflow filename publish-plugin.yml, environment left empty.
# A trusted publisher attaches to a package that already exists, so the
# very first version goes up by hand: npm login, then npm publish in dsh/.
#
# Skips quietly when the version in dsh/package.json is already on npm, so
# re-running (workflow_dispatch) after a failed attempt is safe.
name: publish plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # no registry-url here: with it, setup-node writes an .npmrc whose auth
      # token is a placeholder (XXXXX-XXXXX-XXXXX-XXXXX) and npm, seeing a
      # token configured, skips the OIDC exchange and publishes as nobody (404)
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest && npm --version

      - run: npm ci

      - name: Decide whether this version is new
        id: check
        run: |
          local_v=$(node -p "require('./dsh/package.json').version")
          remote_v=$(npm view dsh-dotline version 2>/dev/null || echo none)
          echo "local=$local_v remote=$remote_v"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${local_v}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match dsh/package.json ${local_v}" >&2
            exit 1
          fi
          if npm view "dsh-dotline@${local_v}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "dsh-dotline@${local_v} is already on npm, nothing to do"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # prepack builds the bundled SPA and the agent runtime
      - name: Pack the plugin
        working-directory: dsh
        run: npm pack --silent && ls -la dsh-dotline-*.tgz

      # every release carries the plugin as a file too, so a user can
      # install it before (or without) npm; the desktop workflow creates
      # the draft release from the same tag, so wait for it briefly
      - name: Attach the tarball to the release
        if: github.ref_type == 'tag'
        working-directory: dsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 30); do
            gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$TAG" dsh-dotline-*.tgz -R "$REPO" --clobber

      - name: Publish dsh-dotline
        if: steps.check.outputs.publish == 'true'
        working-directory: dsh
        # verbose: the OIDC token exchange logs its outcome only at this level
        run: npm publish ./dsh-dotline-*.tgz --provenance --access public --loglevel verbose
